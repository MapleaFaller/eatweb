<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交我吃 · 三食堂 · 门店菜单</title>

    <!-- Font Awesome 图标库（CDN） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- 项目样式（按职责拆分，见 css/ 目录） -->
    <link rel="stylesheet" href="css/base.css" />          <!-- 基础样式：重置、字体、容器 -->
    <link rel="stylesheet" href="css/layout.css" />        <!-- 布局样式：侧边栏 + 主内容区 -->
    <link rel="stylesheet" href="css/components.css" />    <!-- 组件样式：卡片、公告、模态框等 -->
    <link rel="stylesheet" href="css/responsive.css" />    <!-- 响应式样式：≤1024 / ≤768 / ≤480 -->
</head>
<body>

    <div class="app">
        <!-- ===== 左侧边栏 ===== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-utensils"></i>
                <div>
                    <h1>交我吃</h1>
                    <span>· 开饭啦 ·</span>
                </div>
            </div>

            <!-- 手机端右上角索引按钮（桌面端隐藏） -->
            <button type="button" class="index-toggle" id="indexToggle"
                    aria-label="展开或收起索引" aria-expanded="false" aria-controls="menuTree">
                <i class="fas fa-bars"></i> 索引
            </button>

            <div class="menu-tree" id="menuTree">
                <!-- 由 JavaScript 动态生成 -->
            </div>

            <div class="sidebar-footer">
                <i class="fas fa-clock"></i>
                <span>营业 11:00 – 21:30</span>
            </div>
        </aside>

        <!-- ===== 右侧主内容 ===== -->
        <main class="main">
            <div class="main-header">
                <div class="header-top">
                    <div class="header-left">
                        <span class="page-title" id="pageTitle">📢 公告</span>
                        <span class="floor-tag" id="floorTag" style="display:none;">1F</span>
                        <span class="shop-name" id="shopName" style="display:none;">
                            <i class="fas fa-store"></i> <span id="shopNameText">川味小馆</span>
                        </span>
                    </div>
                    <div class="header-right">
                        <i class="fas fa-spoon"></i>
                        <span id="itemCount">0 条公告</span>
                    </div>
                </div>
                <div class="sub-desc" id="subDesc">餐厅最新动态与优惠信息</div>
            </div>

            <!-- 数据源状态提示条（由 app.js 写入，如“读取本地 xlsx/图片 成功或失败”） -->
            <div class="data-notice ok" id="dataNotice" hidden></div>

            <div class="content-wrapper" id="contentWrapper">
                <!-- 由 JavaScript 动态渲染 -->
            </div>
        </main>
    </div>

    <!-- ===== 手机端索引抽屉遮罩层（桌面端隐藏） ===== -->
    <div class="index-mask" id="indexMask"></div>

    <!-- ===== 模态框 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-image">
                <img id="modalImg" src="" alt="菜品图片" />
            </div>
            <div class="modal-body">
                <div class="modal-title" id="modalTitle">菜名</div>
                <div class="modal-price"><i class="fas fa-tag"></i> <span id="modalPrice">¥0.00</span></div>
                <div class="modal-desc" id="modalDesc">菜品描述</div>
            </div>
        </div>
    </div>

    <!--
        项目脚本（按依赖顺序加载）：
        data → utils → state → xlsx解析库 → loader → menu → views → modal → index-panel → app
        前序脚本定义的全局变量/函数，后续脚本才能使用。
    -->
    <script src="js/data.js"></script>        <!-- 骨架数据：食堂 / 楼层 / 门店 元信息 / 公告 -->
    <script src="js/utils.js"></script>       <!-- 工具函数：查找、随机、格式化 -->
    <script src="js/state.js"></script>       <!-- 全局状态与 DOM 引用 -->
    <script src="js/lib/xlsx.full.min.js"></script> <!-- SheetJS：浏览器内解析本地 data/*.xlsx -->
    <script src="js/loader.js"></script>      <!-- 本地数据加载：xlsx 菜品表 + images/ 菜品图片 -->
    <script src="js/menu.js"></script>        <!-- 左侧菜单树渲染 -->
    <script src="js/views.js"></script>       <!-- 右侧内容区视图渲染 -->
    <script src="js/modal.js"></script>       <!-- 菜品详情模态框 -->
    <script src="js/index-panel.js"></script> <!-- 手机端索引抽屉（展开/收起） -->
    <script src="js/app.js"></script>         <!-- 应用入口：异步加载本地数据后初始化 -->

</body>
</html>
